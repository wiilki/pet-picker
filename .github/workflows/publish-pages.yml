name: Pet Picker — verify and publish
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript
        run: node --check docs/app.js
      - name: Verify links and assets
        run: python3 docs/check_site.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pet Picker
        id: deployment
        uses: actions/deploy-pages@v4
